apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi
  namespace: rncp
  labels:
    app: fastapi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fastapi
  template:
    metadata:
      labels:
        app: fastapi
    spec:
      containers:
        - name: fastapi
          image: elshindr/rncp-fastapi:latest
          env:
            - name:
              valueFrom:
                configMapKeyRef:
                  name: models
                  key: MODEL_PATH
          volumeMounts:
            - name: rncp-models
              mountPath: /app/models
          ports:
          - containerPort: 5000
      volumes:
        - name: rncp-models
          persistentVolumeClaim:
            claimName: models